<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="瞿董">
  <meta name="theme-color" content="#1a0a2e">
  <title>QU-DON 瞿董默示錄</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1a0a2e;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;          /* 擋掉 Android 下拉重新整理、iOS 回彈 */
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;        /* 長按不跳出系統選單 */
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      position: fixed; inset: 0;          /* iOS Safari 捲動網址列時畫面不跟著跳 */
      padding-top:    env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left:   env(safe-area-inset-left);
      padding-right:  env(safe-area-inset-right);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container canvas { display: block; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Pixi.js v8 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.2.6/pixi.min.js"></script>

  <!-- Game Modules -->
  <script type="module" src="main.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(r => console.log('[QU-DON] SW registered:', r.scope))
        .catch(e => console.warn('[QU-DON] SW failed:', e));
    }
  </script>
</body>
</html>
